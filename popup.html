<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flow Automation</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e0e0e0;
      margin: 0;
    }
    h2 { margin: 0 0 8px; font-size: 16px; color: #4ecca3; }
    p { font-size: 13px; color: #888; margin: 0 0 16px; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #4ecca3;
      color: #0d1117;
    }
    .btn-primary:hover { background: #3db892; }
    .btn-secondary {
      background: #161b22;
      color: #e0e0e0;
      border: 1px solid #333;
    }
    .btn-secondary:hover { background: #1f2937; }
    .status { font-size: 12px; color: #666; text-align: center; margin-top: 8px; }
    .version { font-size: 11px; color: #444; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Flow Automation</h2>
  <p>Open Google Flow to use the automation panel.</p>
  <button class="btn btn-primary" id="openFlow">Open Google Flow</button>
  <button class="btn btn-secondary" id="openCurrent">Open Panel on Current Tab</button>
  <div class="status" id="status"></div>
  <div class="version">v2.0.0</div>

  <script>
    document.getElementById('openFlow').addEventListener('click', () => {
      chrome.tabs.create({ url: 'https://labs.google/fx/tools/flow' });
      window.close();
    });

    document.getElementById('openCurrent').addEventListener('click', async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      if (tab) {
        chrome.tabs.sendMessage(tab.id, { action: 'TOGGLE_PANEL' }, (response) => {
          if (chrome.runtime.lastError) {
            document.getElementById('status').textContent = 'Navigate to Google Flow first.';
          } else {
            window.close();
          }
        });
      }
    });

    // Show current status
    chrome.storage.local.get(['status', 'currentIndex', 'prompts'], (data) => {
      const statusEl = document.getElementById('status');
      if (data.status && data.status !== 'idle') {
        const total = (data.prompts || []).length;
        const current = data.currentIndex || 0;
        statusEl.textContent = `Status: ${data.status} (${current}/${total} prompts)`;
      }
    });
  </script>
</body>
</html>
