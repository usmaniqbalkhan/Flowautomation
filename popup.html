<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Prompt Automation</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="container">

    <!-- Header -->
    <div id="header">
      <h1>Flow Automation</h1>
      <span id="status-badge">Idle</span>
    </div>

    <!-- File Upload Section -->
    <section id="file-section">
      <h2>Prompt File</h2>
      <div class="row">
        <input type="file" id="file-input" accept=".txt">
      </div>
      <div class="row">
        <label class="radio-label">
          <input type="radio" name="parse-mode" value="paragraph" checked> Paragraph
        </label>
        <label class="radio-label">
          <input type="radio" name="parse-mode" value="line"> Line
        </label>
        <button id="btn-load" class="btn btn-small">Load Prompts</button>
      </div>
      <div class="stat-row">
        <span class="stat-label">Prompts loaded:</span>
        <span id="prompt-count" class="stat-value">0</span>
      </div>
    </section>

    <!-- Settings Section -->
    <section id="settings-section">
      <h2>Settings</h2>
      <div class="setting-grid">
        <label for="batch-size">Batch size:</label>
        <input type="number" id="batch-size" value="4" min="1" max="50">

        <label for="cooldown">Cooldown (ms):</label>
        <input type="number" id="cooldown" value="60000" min="1000" step="1000">

        <label for="intra-gap">Intra-prompt gap (ms):</label>
        <input type="number" id="intra-gap" value="3000" min="500" step="500">

        <label for="typing-delay">Typing delay (ms):</label>
        <input type="number" id="typing-delay" value="20" min="5" max="200">

        <label for="submit-method">Submit method:</label>
        <select id="submit-method">
          <option value="auto" selected>Auto (fallback)</option>
          <option value="enter">Enter key</option>
          <option value="button">Button click</option>
        </select>
      </div>
    </section>

    <!-- Progress Section -->
    <section id="progress-section">
      <h2>Progress</h2>
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
        <span id="progress-pct">0%</span>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card-value" id="stat-current">0</div>
          <div class="stat-card-label">Current</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-value" id="stat-total">0</div>
          <div class="stat-card-label">Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-value" id="stat-remaining">0</div>
          <div class="stat-card-label">Remaining</div>
        </div>
      </div>
      <div id="countdown-display" style="display:none;">
        <span class="stat-label">Next batch in:</span>
        <span id="countdown-value" class="countdown-val">0s</span>
      </div>
    </section>

    <!-- Controls -->
    <section id="controls-section">
      <div class="btn-row">
        <button id="btn-start" class="btn btn-primary">Start Automation</button>
      </div>
      <div class="btn-row">
        <button id="btn-pause" class="btn btn-warn" disabled>Pause</button>
        <button id="btn-resume" class="btn btn-success" disabled>Resume</button>
        <button id="btn-stop" class="btn btn-danger" disabled>Stop</button>
      </div>
      <div class="btn-row">
        <button id="btn-skip" class="btn btn-small" disabled>Skip Current</button>
        <button id="btn-reset" class="btn btn-small btn-outline">Reset Progress</button>
      </div>
    </section>

    <!-- Log Section -->
    <section id="log-section">
      <h2>Log</h2>
      <div id="log-area"></div>
    </section>

    <!-- Options link -->
    <div id="footer">
      <a href="#" id="options-link">Advanced Settings</a>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
